<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小嘟衣櫥">
<title>小嘟衣櫥</title>
<link rel="icon" type="image/png" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#F4EFEA; --card:#FBF8F5; --ink:#3F3833; --sub:#8C8079; --faint:#B7ADA5;
  --line:#E6DED6; --accent:#A3897A; --accent-d:#7E6A5E; --accent-l:#EAE0D7;
  --danger:#B4766B; --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;letter-spacing:.02em}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
.hidden{display:none!important}

/* ===== Header ===== */
header{position:sticky;top:0;z-index:20;background:rgba(244,239,234,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:calc(var(--safe-t) + 14px) 18px 10px}
.top{display:flex;align-items:center;gap:6px}
.top h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.08em;flex:1}
.top h1 small{font-size:12px;font-weight:400;color:var(--sub);margin-left:8px;letter-spacing:.04em}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--accent-l)}
.ib.on{background:var(--ink);color:var(--card)}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px}
.search input{flex:1;border:0;background:none;outline:none;font-size:14px;min-width:0}
.search .fbtn{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);padding-left:10px;border-left:1px solid var(--line);height:22px}
.search .fbtn.on{color:var(--accent-d);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px -18px 0;padding:0 18px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--sub);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab b{font-weight:500;font-size:11px;color:var(--faint)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.tab.on b{color:#CFC4BB}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

/* ===== Grid / list ===== */
main{padding:6px 14px calc(110px + var(--safe-b))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(63,56,51,.05)}
.card .ph{aspect-ratio:3/4;background:var(--accent-l);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:9px 11px 11px}
.card .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sm{font-size:12px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.card .badge{position:absolute;top:8px;left:8px;background:rgba(251,248,245,.92);border-radius:999px;padding:3px 9px 3px 7px;font-size:11px;display:flex;align-items:center;gap:5px}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);position:relative}
.row:last-child{border-bottom:0}
.row img{width:54px;height:68px;border-radius:9px;object-fit:cover;background:var(--accent-l);flex:none}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sm{font-size:12px;color:var(--sub);margin-top:4px}
.row .rt{text-align:right;font-size:12px;color:var(--sub);flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink)}
.check{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:1.5px solid #fff;background:rgba(63,56,51,.25);display:grid;place-items:center;color:#fff}
.row .check{position:static;border-color:var(--faint);background:none;flex:none}
.picked .check{background:var(--accent-d);border-color:var(--accent-d)}
.selecting .card:not(.picked){opacity:.8}
.empty{text-align:center;color:var(--sub);padding:70px 20px;font-size:14px;line-height:1.9}

.fab{position:fixed;right:20px;bottom:calc(24px + var(--safe-b));width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;box-shadow:0 6px 18px rgba(63,56,51,.25);z-index:15}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(16px + var(--safe-b));background:var(--ink);color:var(--card);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;z-index:16;box-shadow:0 6px 18px rgba(63,56,51,.25)}
.selbar span{flex:1;font-size:14px}
.selbar .mini{font-size:12px;color:#CFC4BB;text-decoration:underline;text-underline-offset:3px}
.selbar .go{background:var(--card);color:var(--ink);border-radius:11px;padding:9px 14px;font-size:14px;font-weight:600}
.selbar .go:disabled{opacity:.4}

/* ===== Panels ===== */
.panel{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .28s ease;visibility:hidden}
.panel.open{transform:none;visibility:visible}
.pbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 10px) 10px 10px;background:rgba(244,239,234,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pbar h2{flex:1;margin:0;font-size:16px;font-weight:600;text-align:center;letter-spacing:.06em}
.pbar .txtbtn{font-size:14px;padding:8px 10px;color:var(--accent-d);font-weight:600;min-width:52px}
.pbody{padding:4px 18px calc(110px + var(--safe-b))}

/* detail */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;border-radius:var(--radius);background:var(--accent-l);scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel img{flex:none;width:100%;aspect-ratio:3/4;object-fit:cover;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent-d)}
.dtitle{font-size:21px;font-weight:600;margin:16px 2px 4px;letter-spacing:.04em}
.dsub{color:var(--sub);font-size:13px;margin:0 2px 14px}
.info{background:var(--card);border-radius:var(--radius);padding:4px 16px}
.info .r{display:flex;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.info .r:last-child{border-bottom:0}
.info .k{width:76px;color:var(--sub);flex:none}
.info .v{flex:1;white-space:pre-wrap;word-break:break-word}
.linkline{display:block;text-align:center;font-size:13px;color:var(--sub);margin:18px 0 0;text-decoration:underline;text-underline-offset:3px}
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + var(--safe-b));background:linear-gradient(rgba(244,239,234,0),var(--bg) 30%);display:flex;gap:10px;z-index:6}
.btn{flex:1;height:48px;border-radius:13px;font-size:15px;font-weight:600;letter-spacing:.08em}
.btn.pri{background:var(--ink);color:var(--card)}
.btn.sec{background:var(--card);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* form */
.f{margin-bottom:20px}
.f>label,.flabel{display:block;font-size:13px;color:var(--sub);margin:0 2px 8px;letter-spacing:.06em}
.f>label em,.flabel em{color:var(--danger);font-style:normal;margin-left:2px}
.inp{width:100%;height:44px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:0 13px;font-size:15px;outline:none}
textarea.inp{height:auto;min-height:84px;padding:11px 13px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chip.add{border-style:dashed;color:var(--sub)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow .inp{height:38px;font-size:14px}
.addrow button{flex:none;padding:0 14px;border-radius:10px;background:var(--accent-d);color:#fff;font-size:14px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pt{position:relative;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:var(--accent-l)}
.pt img{width:100%;height:100%;object-fit:cover}
.pt .tag{position:absolute;left:6px;bottom:6px;background:var(--ink);color:var(--card);font-size:11px;padding:2px 7px;border-radius:6px}
.pt .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(63,56,51,.6);color:#fff;display:grid;place-items:center}
.pt .mk{position:absolute;left:6px;bottom:6px;background:rgba(251,248,245,.92);font-size:11px;padding:2px 7px;border-radius:6px}
.pt.addp{border:1.5px dashed var(--faint);background:none;display:grid;place-items:center;color:var(--sub);font-size:12px;text-align:center}
.hint{font-size:12px;color:var(--faint);margin:8px 2px 0;line-height:1.6}
.money{position:relative}
.money .inp{padding-left:46px}
.money span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:13px}
.del{display:block;margin:30px auto 0;color:var(--danger);font-size:14px;padding:10px 20px}

/* sheet / modal */
.mask{position:fixed;inset:0;background:rgba(63,56,51,.35);z-index:60;opacity:0;visibility:hidden;transition:opacity .2s}
.mask.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + var(--safe-b));z-index:61;transform:translateY(105%);transition:transform .25s ease;max-height:82vh;overflow-y:auto}
.sheet.open{transform:none}
.sheet h3{margin:0 0 16px;font-size:16px;text-align:center;font-weight:600;letter-spacing:.06em}
.modal{position:fixed;left:50%;top:50%;width:min(86vw,340px);transform:translate(-50%,-46%);background:var(--card);border-radius:18px;padding:22px 20px 16px;z-index:71;opacity:0;visibility:hidden;transition:all .2s}
.modal.open{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.modal h3{margin:0 0 8px;font-size:17px;text-align:center}
.modal p{margin:0 0 18px;color:var(--sub);font-size:14px;line-height:1.7;text-align:center;white-space:pre-line}
.modal .acts{display:flex;gap:10px}
.modal .btn{height:44px}
.modal .btn.danger{background:var(--danger);color:#fff}
#cmask{z-index:70}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 18px);transform:translate(-50%,-20px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;z-index:95;background:rgba(244,239,234,.75);display:grid;place-items:center;font-size:14px;color:var(--ink)}
.busy div{background:var(--card);padding:18px 22px;border-radius:14px;box-shadow:0 4px 20px rgba(63,56,51,.12);display:flex;align-items:center;gap:12px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent-d);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.syncline{font-size:11px;color:var(--faint);text-align:center;margin:18px 0 0}

/* export */
.exitem{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.exitem .t{font-size:14px;font-weight:500;margin-bottom:10px}
.exitem .pics{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.expic{position:relative;flex:none;width:64px;height:80px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--accent-l)}
.expic img{width:100%;height:100%;object-fit:cover;opacity:.55}
.expic.on{border-color:var(--accent-d)}
.expic.on img{opacity:1}
.expic b{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--accent-d);color:#fff;font-size:11px;display:grid;place-items:center}
.expic i{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10px;background:rgba(251,248,245,.92);padding:1px 5px;border-radius:5px}
.expic.add{border:1.5px dashed var(--faint);background:none;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.saveback{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:10px}
.saveback input{width:18px;height:18px;accent-color:var(--accent-d)}
.exitem .money{margin-top:10px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results img{width:100%;border-radius:10px;display:block;box-shadow:0 1px 4px rgba(63,56,51,.1)}
.results a{display:block;text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
.sect{font-size:13px;color:var(--sub);margin:22px 2px 10px;letter-spacing:.06em}
.box{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.box p{margin:0 0 12px;font-size:13px;color:var(--sub);line-height:1.7}
.box .f:last-child{margin-bottom:0}
</style>
</head>
<body>

<header id="hdr">
  <div class="top">
    <h1>小嘟衣櫥<small id="count"></small></h1>
    <button class="ib" id="btnSelect" title="選取製作拍賣卡"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></svg></button>
    <button class="ib" id="btnView" title="切換瀏覽方式"></button>
    <button class="ib" id="btnSettings" title="設定"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8C8079" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜尋名稱、品牌、備註" autocomplete="off">
    <button class="fbtn" id="btnFilter">篩選</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<button class="fab" id="fab" aria-label="新增衣服"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="selbar hidden" id="selbar">
  <span id="selcount">已選 0 件</span>
  <button class="mini" id="selAllSale">全選待出售</button>
  <button class="go" id="selGo" disabled>製作拍賣卡</button>
</div>

<!-- 詳細頁 -->
<section class="panel" id="pDetail">
  <div class="pbar">
    <button class="ib" data-back><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <h2>衣服資料</h2><span style="width:38px"></span>
  </div>
  <div class="pbody" id="detailBody"></div>
  <div class="bottombar"><button class="btn pri" id="btnEdit">編輯</button></div>
</section>

<!-- 編輯頁 -->
<section class="panel" id="pEdit">
  <div class="pbar">
    <button class="txtbtn" data-back style="color:var(--sub);font-weight:400">取消</button>
    <h2 id="editTitle">新增衣服</h2><span style="min-width:52px"></span>
  </div>
  <div class="pbody" id="editBody"></div>
  <div class="bottombar"><button class="btn pri" id="btnSave">儲存</button></div>
</section>

<!-- 拍賣卡 -->
<section class="panel" id="pExport">
  <div class="pbar">
    <button class="ib" data-back><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <h2>製作拍賣卡</h2><span style="width:38px"></span>
  </div>
  <div class="pbody" id="exportBody"></div>
  <div class="bottombar" id="exportBar"></div>
</section>

<!-- 設定 -->
<section class="panel" id="pSettings">
  <div class="pbar">
    <button class="ib" data-back><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <h2>設定</h2><span style="width:38px"></span>
  </div>
  <div class="pbody" id="settingsBody"></div>
</section>

<!-- 篩選 -->
<div class="mask" id="fmask"></div>
<div class="sheet" id="fsheet"></div>

<!-- 確認視窗 -->
<div class="mask" id="cmask"></div>
<div class="modal" id="cmodal"><h3 id="cTitle"></h3><p id="cText"></p><div class="acts"><button class="btn sec" id="cNo">取消</button><button class="btn pri" id="cYes">確定</button></div></div>

<div class="toast" id="toast"></div>
<div class="busy hidden" id="busy"><div><span class="spin"></span><span id="busyText">處理中…</span></div></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="exFileIn" accept="image/*" multiple hidden>

<script>
/* ================= 基本設定 ================= */
const DEFAULT_OPTS = {
  category: ['洋裝','上衣','裙子','褲子','連身','配件','背心外套','其他'],
  size: ['70','80','90','SS','S','M','L','18m','24m'],
  season: ['春夏','秋冬','四季'],
  status: ['未來穿','現在穿','穿不下','待整理','待出售','已售出','贈與','淘汰'],
  condition: ['全新','全新無吊牌','九成新','八成新','七成新','有小瑕疵','有污漬'],
};
const STATUS_COLOR = {'未來穿':'#9CA592','現在穿':'#8FA3B0','穿不下':'#B5ADA6','待整理':'#D4BC8A','待出售':'#D19C7E','已售出':'#A3897A','贈與':'#C9A0A8','淘汰':'#CFC7BF'};
const MAX_PHOTOS = 6;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };

/* ================= 連線 Notion（經過 Worker） ================= */
async function api(path, method = 'GET', body) {
  if (!cfg.worker) throw new Error('還沒設定 Worker 網址');
  let res;
  try {
    res = await fetch(cfg.worker.replace(/\/+$/, '') + path, {
      method,
      headers: { 'Content-Type': 'application/json', 'X-App-Key': cfg.key, 'X-Db-Id': cfg.db },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch { throw new Error('連不上 Worker，請檢查網路或 Worker 網址'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `錯誤 ${res.status}`);
  return data;
}

async function refresh(silent) {
  if (!cfg.worker || !cfg.db) return;
  try {
    const [r, sc] = await Promise.all([api('/items'), api('/schema')]);
    items = r.items; save('xdc2-items', items);
    for (const k of Object.keys(DEFAULT_OPTS)) if (sc[k] && sc[k].length) opts[k] = sc[k];
    save('xdc2-opts', opts);
    lastSync = new Date();
    render();
    if (curId && $('#pDetail').classList.contains('open')) renderDetail();
  } catch (e) { if (!silent) toast('同步失敗：' + e.message, 3500); }
}

/* ================= 上傳照片到 Cloudinary ================= */
function compress(file, max = 1600, q = .85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const r = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * r); c.height = Math.round(im.naturalHeight * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error('照片壓縮失敗')), 'image/jpeg', q);
    };
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('讀不到這張照片')); };
    im.src = url;
  });
}
async function uploadPhoto(file) {
  const blob = await compress(file);
  const fd = new FormData();
  fd.append('file', blob, 'photo.jpg');
  fd.append('upload_preset', cfg.preset);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${cfg.cloud}/image/upload`, { method: 'POST', body: fd });
  const d = await res.json().catch(() => ({}));
  if (!res.ok || !d.secure_url) throw new Error('照片上傳失敗' + (d.error ? '：' + d.error.message : ''));
  return d.secure_url;
}

const CAN_ADD = { category: true, size: true };
const OPTIONAL = { status: true, condition: true };
function renderChips(key) {
  const box = $('#g-' + key);
  box.innerHTML = `<div class="chips">${opts[key].map(v => `<button class="chip ${ed[key]===v?'on':''}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}
    ${CAN_ADD[key] ? '<button class="chip add" data-add>＋ 新增</button>' : ''}</div>
    <div class="addrow hidden"><input class="inp" placeholder="輸入新的選項" maxlength="20"><button>加入</button></div>`;
  box.querySelectorAll('.chip[data-v]').forEach(c => c.onclick = () => {
    ed[key] = OPTIONAL[key] && ed[key] === c.dataset.v ? '' : c.dataset.v;
    box.querySelectorAll('.chip[data-v]').forEach(x => x.classList.toggle('on', x.dataset.v === ed[key]));
    if (key === 'status') togglePriceRows();
  });
  const addBtn = box.querySelector('[data-add]');
  if (addBtn) {
    const row = box.querySelector('.addrow'), inp = row.querySelector('input');
    addBtn.onclick = () => { row.classList.toggle('hidden'); inp.focus(); };
    const add = () => {
      const v = inp.value.trim().replace(/,/g, '，');
      if (!v) return;
      if (!opts[key].includes(v)) opts[key].push(v);
      ed[key] = v; renderChips(key);
    };
    row.querySelector('button').onclick = add;
    inp.onkeydown = e => { if (e.key === 'Enter') add(); };
  }
}

    category: ed.category || '', size: ed.size || '', season: ed.season || '',

$('#btnSave').onclick = async () => {
  const data = readForm();
  const miss = [];
  if (!ed.pics.length) miss.push('照片');
  if (!data.category) miss.push('類別');
  if (!data.size) miss.push('尺寸');
  if (!data.season) miss.push('季節');
  if (miss.length) return toast('還沒填：' + miss.join('、'));
  const ok = await confirmBox(ed.isNew ? '新增這件衣服？' : '儲存修改？',
    `「${title({ ...data })}」\n${[data.category, data.size, data.season, data.status].filter(Boolean).join(' · ')}\n確定後會寫入 Notion`, '確定儲存');
  if (!ok) return;
  try {
    const newOnes = ed.pics.filter(p => p.file);
    for (let k = 0; k < ed.pics.length; k++) {
      const p = ed.pics[k];
      if (p.file) { busy(`上傳照片 ${newOnes.indexOf(p) + 1} / ${newOnes.length}…`); p.url = await uploadPhoto(p.file); delete p.file; }
    }
    busy('寫入 Notion…');
    data.photos = ed.pics.map(p => p.url);
    const r = ed.isNew ? await api('/items', 'POST', data) : await api('/items/' + ed.id, 'PATCH', data);
    const i = items.findIndex(x => x.id === r.item.id);
    if (i >= 0) items[i] = r.item; else items.unshift(r.item);
    save('xdc2-items', items);
    busy(false); toast(ed.isNew ? '已新增 ✓' : '已儲存 ✓');
    render(); if (!ed.isNew) renderDetail();
    closeTop();
    refresh(true); // 重新抓一次選項（例如新增的尺寸）
  } catch (e) { busy(false); toast('儲存失敗：' + e.message, 4000); }
};
async function doDelete() {
  const ok = await confirmBox('刪除這件衣服？', `「${title(ed)}」\n會移到 Notion 的垃圾桶，30 天內還可以在 Notion 救回。`, '刪除', true);
  if (!ok) return;
  try {
    busy('刪除中…');
    await api('/items/' + ed.id, 'DELETE');
    items = items.filter(i => i.id !== ed.id); save('xdc2-items', items);
    busy(false); toast('已刪除');
    render();
    closeTop(); setTimeout(closeTop, 350); // 關掉編輯頁和詳細頁
  } catch (e) { busy(false); toast('刪除失敗：' + e.message, 4000); }
}

/* ================= 拍賣卡 ================= */
let ex = [], exTarget = -1;
const EX_MAX = 4;
function openExport() {
  ex = items.filter(i => picked.has(i.id)).map(it => ({
    it, pics: it.photos.map(url => ({ url })), sel: [0], price: it.askPrice ?? '', saveBack: true,
  }));
  renderExportSetup(); openPanel('pExport');
}
const picSrc = (p, t) => p.preview || img(p.url, t);
function renderExportSetup() {
  $('#exportBody').innerHTML = `
    <p class="hint" style="margin:0 2px 14px">每件衣服會做成一張直式圖片（1080×1350，適合 IG／FB）。<br>點照片可以多選（最多 ${EX_MAX} 張，例如正面＋背面），數字是排列順序，1 號會放最大。也可以現場拍新照片。這裡改的售價不會寫回 Notion。</p>
    ${ex.map((e, i) => {
      const newCount = e.pics.filter(p => p.file).length;
      return `<div class="exitem" data-i="${i}">
      <div class="t">${esc(title(e.it))} <span style="color:var(--sub);font-weight:400">· ${esc(e.it.size)}${e.it.condition ? ' · ' + esc(e.it.condition) : ''}</span></div>
      <div class="pics">${e.pics.map((p, j) => {
        const n = e.sel.indexOf(j);
        return `<div class="expic ${n >= 0 ? 'on' : ''}" data-j="${j}"><img src="${esc(picSrc(p, 'w_200,c_limit,q_auto,f_auto'))}" alt="">${n >= 0 ? `<b>${n + 1}</b>` : ''}${p.file ? '<i>新</i>' : ''}</div>`;
      }).join('')}
        <button class="expic add" data-add><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>加照片</button>
      </div>
      ${newCount ? `<label class="saveback"><input type="checkbox" ${e.saveBack ? 'checked' : ''}> 把 ${newCount} 張新照片也存進這件衣服</label>` : ''}
      <div class="money"><span>NT$</span><input class="inp price" type="number" inputmode="numeric" placeholder="售價（選填）" value="${e.price}"></div>
    </div>`;
    }).join('')}
    <div class="f" style="margin-top:20px"><label>卡片底部文字（選填，會記住）</label>
      <input class="inp" id="exFooter" placeholder="例如：台北可面交｜賣貨便寄送" value="${esc(cfg.footer)}"></div>`;
  $('#exportBody').querySelectorAll('.exitem').forEach(box => {
    const i = +box.dataset.i, e = ex[i];
    box.querySelectorAll('.expic[data-j]').forEach(el => el.onclick = () => {
      const j = +el.dataset.j, k = e.sel.indexOf(j);
      if (k >= 0) { if (e.sel.length === 1) return toast('至少要選一張照片'); e.sel.splice(k, 1); }
      else { if (e.sel.length >= EX_MAX) return toast(`一張卡片最多 ${EX_MAX} 張照片`); e.sel.push(j); }
      keepFooter(); renderExportSetup();
    });
    box.querySelector('[data-add]').onclick = () => { exTarget = i; $('#exFileIn').click(); };
    const sb = box.querySelector('.saveback input'); if (sb) sb.onchange = ev => e.saveBack = ev.target.checked;
    box.querySelector('.price').oninput = ev => e.price = ev.target.value;
  });
  $('#exportBar').innerHTML = `<button class="btn pri" id="exGo">產生 ${ex.length} 張圖片</button>`;
  $('#exGo').onclick = makeCards;
}
function keepFooter() { const f = $('#exFooter'); if (f) { cfg.footer = f.value.trim(); save('xdc2-cfg', cfg); } }
$('#exFileIn').onchange = ev => {
  const e = ex[exTarget]; if (!e) return;
  [...ev.target.files].forEach(f => {
    e.pics.push({ file: f, preview: URL.createObjectURL(f) });
    if (e.sel.length < EX_MAX) e.sel.push(e.pics.length - 1);
  });
  ev.target.value = ''; keepFooter(); renderExportSetup();
};

function loadImg(src) {
  return new Promise((res, rej) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => res(im); im.onerror = () => rej(new Error('照片載入失敗'));
    im.src = src;
  });
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fitText(ctx, s, maxW) {
  if (ctx.measureText(s).width <= maxW) return s;
  while (s.length && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}
function wrapLines(ctx, s, maxW, maxLines) {
  const chars = [...s.replace(/\s*\n+\s*/g, ' ')];
  const lines = []; let cur = '';
  for (let i = 0; i < chars.length; i++) {
    if (ctx.measureText(cur + chars[i]).width <= maxW) { cur += chars[i]; continue; }
    if (lines.length === maxLines - 1) { lines.push(fitText(ctx, cur + chars.slice(i).join(''), maxW)); return lines; }
    lines.push(cur); cur = chars[i];
  }
  if (cur) lines.push(cur);
  return lines;
}
async function drawCard(e) {
  const W = 1080, H = 1350, F = '-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#F4EFEA'; ctx.fillRect(0, 0, W, H);

  // 照片：1 張填滿；2 張左右；3 張左大右二；4 張田字
  const px = 48, py = 48, pw = W - 96, ph = 900, g = 12;
  const n = e.sel.length, hw = (pw - g) / 2, hh = (ph - g) / 2, bw = Math.round(pw * 0.6), sw2 = pw - bw - g;
  const cells = n === 1 ? [[px, py, pw, ph]]
    : n === 2 ? [[px, py, hw, ph], [px + hw + g, py, hw, ph]]
    : n === 3 ? [[px, py, bw, ph], [px + bw + g, py, sw2, hh], [px + bw + g, py + hh + g, sw2, hh]]
    : [[px, py, hw, hh], [px + hw + g, py, hw, hh], [px, py + hh + g, hw, hh], [px + hw + g, py + hh + g, hw, hh]];
  const ims = await Promise.all(e.sel.map(j => loadImg(picSrc(e.pics[j], 'w_1400,c_limit,q_auto:good,f_jpg'))));
  ims.forEach((im, k) => {
    const [x, y0, w, h] = cells[k];
    const s = Math.max(w / im.naturalWidth, h / im.naturalHeight), cw = w / s, ch = h / s;
    ctx.save(); rr(ctx, x, y0, w, h, n === 1 ? 28 : 22); ctx.clip();
    ctx.fillStyle = '#fff'; ctx.fillRect(x, y0, w, h);
    ctx.drawImage(im, (im.naturalWidth - cw) / 2, (im.naturalHeight - ch) / 2, cw, ch, x, y0, w, h);
    ctx.restore();
  });

  const L = 64, R = W - 64;
  let y = 1030;
  // 售價（右）
  let priceW = 0;
  if (e.price !== '' && e.price != null) {
    ctx.font = `600 58px ${F}`; ctx.fillStyle = '#7E6A5E'; ctx.textAlign = 'right';
    const ptxt = 'NT$ ' + Number(e.price).toLocaleString();
    ctx.fillText(ptxt, R, y); priceW = ctx.measureText(ptxt).width + 30;
  }
  // 名稱（左）
  ctx.textAlign = 'left'; ctx.fillStyle = '#3F3833'; ctx.font = `600 50px ${F}`;
  ctx.fillText(fitText(ctx, title(e.it), R - L - priceW), L, y);
  // 品牌 · 尺寸
  y += 58; ctx.font = `400 34px ${F}`; ctx.fillStyle = '#8C8079';
  ctx.fillText(fitText(ctx, [e.it.brand, '尺寸 ' + e.it.size].filter(Boolean).join('  ·  '), R - L), L, y);
  // 品相標籤
  if (e.it.condition) {
    y += 26; ctx.font = `500 28px ${F}`;
    const tw = ctx.measureText(e.it.condition).width;
    ctx.fillStyle = '#EAE0D7'; rr(ctx, L, y, tw + 36, 48, 24); ctx.fill();
    ctx.fillStyle = '#7E6A5E'; ctx.textBaseline = 'middle'; ctx.fillText(e.it.condition, L + 18, y + 25); ctx.textBaseline = 'alphabetic';
    y += 48;
  }
  // 備註
  if (e.it.note) {
    ctx.font = `400 29px ${F}`; ctx.fillStyle = '#6E635C';
    wrapLines(ctx, e.it.note, R - L, 2).forEach(line => { y += 46; ctx.fillText(line, L, y); });
  }
  // 底部文字
  if (cfg.footer) {
    ctx.font = `400 25px ${F}`; ctx.fillStyle = '#A99D94'; ctx.textAlign = 'center';
    ctx.fillText(fitText(ctx, cfg.footer, W - 128), W / 2, H - 34);
  }
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', .92));
}
// 把匯出時新拍的照片存回 Notion（需要確認）
async function saveBackPhotos() {
  const todo = ex.filter(e => e.saveBack && e.pics.some(p => p.file));
  if (!todo.length) return;
  const over = todo.filter(e => e.pics.length > MAX_PHOTOS);
  const ok = await confirmBox('把新照片存進衣服？',
    todo.map(e => `「${title(e.it)}」新增 ${e.pics.filter(p => p.file).length} 張`).join('\n') +
    (over.length ? `\n\n每件最多 ${MAX_PHOTOS} 張，超過的只會用在拍賣卡，不會存進去。` : '') + '\n確定後會寫入 Notion', '確定儲存');
  if (!ok) return;
  try {
    for (const e of todo) {
      const news = e.pics.filter(p => p.file);
      for (let k = 0; k < news.length; k++) { busy(`上傳照片「${title(e.it)}」${k + 1} / ${news.length}…`); news[k].url = await uploadPhoto(news[k].file); }
      const room = Math.max(0, MAX_PHOTOS - e.it.photos.length);
      const add = news.slice(0, room).map(p => p.url);
      news.forEach(p => { delete p.file; });
      if (!add.length) continue;
      busy('寫入 Notion…');
      const r = await api('/items/' + e.it.id, 'PATCH', { photos: [...e.it.photos, ...add] });
      const i = items.findIndex(x => x.id === r.item.id); if (i >= 0) items[i] = r.item;
      e.it = r.item;
    }
    save('xdc2-items', items); render(); busy(false); toast('照片已存進衣服 ✓');
  } catch (err) { busy(false); toast('照片存檔失敗：' + err.message + '（拍賣卡仍可使用）', 4500); }
}
async function makeCards() {
  keepFooter();
  await saveBackPhotos();
  const files = [];
  try {
    for (let i = 0; i < ex.length; i++) {
      busy(`製作中 ${i + 1} / ${ex.length}…`);
      const blob = await drawCard(ex[i]);
      const nm = title(ex[i].it).replace(/[\\/:*?"<>|]/g, '').slice(0, 30);
      files.push(new File([blob], `小嘟衣櫥_${i + 1}_${nm}.jpg`, { type: 'image/jpeg' }));
    }
  } catch (e) { busy(false); return toast('製作失敗：' + e.message, 4000); }
  busy(false);
  const urls = files.map(f => URL.createObjectURL(f));
  $('#exportBody').innerHTML = `
    <p class="hint" style="margin:0 2px 14px">完成！按下方「分享／儲存」可以一次存到相簿或傳到 IG；也可以長按單張圖片儲存。</p>
    <div class="results">${urls.map((u, i) => `<div><img src="${u}" alt=""><a href="${u}" download="${esc(files[i].name)}">下載這張</a></div>`).join('')}</div>`;
  const canShare = navigator.canShare && navigator.canShare({ files });
  $('#exportBar').innerHTML = `<button class="btn sec" id="exBack">返回調整</button>
    ${canShare ? '<button class="btn pri" id="exShare">分享／儲存</button>' : ''}`;
  $('#exBack').onclick = renderExportSetup;
  if (canShare) $('#exShare').onclick = async () => {
    try { await navigator.share({ files }); } catch (e) { if (e.name !== 'AbortError') toast('分享失敗：' + e.message); }
  };
}

/* ================= 設定 ================= */
function openSettings() {
  const v = k => esc(cfg[k]);
  $('#settingsBody').innerHTML = `
    <div class="sect">連線 Notion</div>
    <div class="box">
      <p>照著 GitHub 上 README 的步驟架好 Cloudflare Worker 後，把網址和密碼填在這裡。</p>
      <div class="f"><label>Worker 網址</label><input class="inp" id="sWorker" placeholder="https://xxx.workers.dev" value="${v('worker')}" autocapitalize="off"></div>
      <div class="f"><label>密碼（APP_PASSWORD）</label><input class="inp" id="sKey" type="password" value="${v('key')}"></div>
      <div class="f"><label>資料庫 ID</label><input class="inp" id="sDb" placeholder="建立資料庫後會自動填入" value="${v('db')}" autocapitalize="off"></div>
      <div style="display:flex;gap:10px"><button class="btn sec" id="sTest">測試連線</button><button class="btn pri" id="sSave">儲存</button></div>
    </div>
    <div class="sect">第一次使用：建立 Notion 資料庫</div>
    <div class="box">
      <p>在 Notion 新增一個空白頁面（例如叫「小嘟」），右上角「⋯ → 連結」加入你的 integration，再把該頁面的連結貼在下面。</p>
      <div class="f"><label>Notion 頁面連結</label><input class="inp" id="sParent" placeholder="https://www.notion.so/..." autocapitalize="off"></div>
      <button class="btn pri" id="sSetup" style="width:100%">建立「小嘟衣櫥」資料庫</button>
    </div>
    <div class="sect">照片（Cloudinary）</div>
    <div class="box">
      <div class="f"><label>Cloud name</label><input class="inp" id="sCloud" value="${v('cloud')}" autocapitalize="off"></div>
      <div class="f"><label>Upload preset（unsigned）</label><input class="inp" id="sPreset" value="${v('preset')}" autocapitalize="off"></div>
    </div>
    <div class="sect">其他</div>
    <div class="box"><button class="btn sec" id="sClear" style="width:100%">清除這台手機的暫存</button>
    <p style="margin:10px 0 0">只清掉手機上的暫存，Notion 裡的資料不受影響。</p></div>`;
  const grab = () => {
    cfg.worker = $('#sWorker').value.trim(); cfg.key = $('#sKey').value.trim(); cfg.db = $('#sDb').value.trim().replace(/-/g, '');
    cfg.cloud = $('#sCloud').value.trim(); cfg.preset = $('#sPreset').value.trim(); save('xdc2-cfg', cfg);
  };
  $('#sSave').onclick = () => { grab(); toast('已儲存'); render(); refresh(); };
  $('#sTest').onclick = async () => {
    grab();
    try { busy('測試中…'); const r = await api('/ping'); busy(false);
      toast(r.dbTitle ? `連線成功 ✓ 資料庫：${r.dbTitle}` : '連線成功 ✓（還沒有資料庫）', 3500);
    } catch (e) { busy(false); toast(e.message, 4000); }
  };
  $('#sSetup').onclick = async () => {
    grab();
    const link = $('#sParent').value.split('?')[0].replace(/-/g, '');
    const ids = link.match(/[0-9a-f]{32}/gi);
    if (!ids) return toast('看不懂這個連結，請貼上 Notion 頁面的完整網址');
    if (cfg.db && !(await confirmBox('已經有資料庫了', '確定要再建立一個新的嗎？新的會是空的。', '建立新的'))) return;
    try {
      busy('建立資料庫中…');
      const r = await api('/setup', 'POST', { parentPageId: ids[ids.length - 1] });
      cfg.db = r.databaseId.replace(/-/g, ''); save('xdc2-cfg', cfg); $('#sDb').value = cfg.db;
      busy(false); toast('資料庫建立完成 ✓', 3000); items = []; render(); refresh();
    } catch (e) { busy(false); toast('建立失敗：' + e.message, 4500); }
  };
  $('#sClear').onclick = async () => {
    if (!(await confirmBox('清除暫存？', '連線設定會保留，衣服清單會重新從 Notion 下載。'))) return;
    localStorage.removeItem('xdc2-items'); localStorage.removeItem('xdc2-opts');
    items = []; opts = Object.assign({}, DEFAULT_OPTS); render(); refresh();
  };
  openPanel('pSettings');
}

/* ================= 開始 ================= */
render();
if (!cfg.worker) openSettings(); else refresh();
</script>
