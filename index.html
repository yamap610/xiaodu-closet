/* ☁️ 雲端：Firebase（資料）＋ Cloudinary（照片） */
const FB={apiKey:"AIzaSyAFGSQOvAp1thZkWBZ-nLHe-uR8llDQDI8",authDomain:"home-hub-be41f.firebaseapp.com",projectId:"home-hub-be41f",storageBucket:"home-hub-be41f.firebasestorage.app",messagingSenderId:"286497032414",appId:"1:286497032414:web:16d3f0242a400d0de85a4f"};
const CL_CLOUD='dxd5ijwof',CL_PRESET='ml_default',COL='xiaodu_closet',FBV='10.12.0';
let fdb=null,fs=null,synced=new Map(),syncState='☁️ 連線中…',syncT=0,ready=false,lastKid=null,busy=false;
const js=i=>JSON.stringify(i);

function setSync(t){syncState=t;const el=$('#sync');if(el)el.textContent=t}
function applyRemote(snap){
  const arr=[];snap.forEach(d=>arr.push(d.data()));order(arr);

async function commitOps(ops){for(let k=0;k<ops.length;k+=400){const b=fs.writeBatch(fdb);ops.slice(k,k+400).forEach(o=>o(b));await b.commit()}}
async function cloudInit(){
  try{
    const [A,F]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)]);
    fs=F;fdb=F.initializeFirestore(A.initializeApp(FB,'xiaodu'),{ignoreUndefinedProperties:true});
    const ms=await F.getDoc(F.doc(fdb,COL+'_settings','main'));
    if(ms.exists()&&ms.data().kid){kid=ms.data().kid}lastKid=kid;
    const snap=await F.getDocs(F.collection(fdb,COL));
    if(snap.empty&&items.length){
      setSync('☁️ 第一次同步：上傳 '+items.length+' 件資料中…');
      await commitOps(items.map(i=>b=>b.set(F.doc(fdb,COL,String(i.id)),i)));

      synced=new Map(items.map(i=>[i.id,js(i)]));
    }else applyRemote(snap);
    ready=true;setSync('☁️ 已同步');render();
    F.onSnapshot(F.collection(fdb,COL),s=>{if(!s.metadata.hasPendingWrites)applyRemote(s)},e=>setSync('⚠️ '+errMsg(e)));
  }catch(e){setSync('⚠️ 雲端連線失敗：'+errMsg(e));toast('雲端連線失敗，資料先存在這支手機')}
}
function schedule(){if(!ready)return;clearTimeout(syncT);syncT=setTimeout(syncNow,700)}
async function syncNow(){
  const F=fs,ops=[],done=[],ids=new Set();
  for(const i of items){ids.add(i.id);const j=js(i);if(synced.get(i.id)!==j){ops.push(b=>b.set(F.doc(fdb,COL,String(i.id)),i));done.push([i.id,j])}}
  const gone=[...synced.keys()].filter(id=>!ids.has(id));
  gone.forEach(id=>ops.push(b=>b.delete(F.doc(fdb,COL,String(id)))));
  const k=kid;if(k!==lastKid)ops.push(b=>b.set(F.doc(fdb,COL+'_settings','main'),{kid:k},{merge:true}));

  const base={cat:d.cat,size,season:d.season,brand:String(d.brand||'').trim(),note:String(d.note||'').trim(),cost:d.cost,status:d.status,price:d.price,cond:d.cond,sold:d.sold};
  if(!d.id){
    if(!d.imgs.length){toast('請先選照片 📷');return}
    busy=true;const n=d.imgs.length,now=Date.now(),urls=[];let bad=0;
    for(let k=0;k<n;k++){toast(`上傳照片中 ${k+1}/${n}…`);try{urls.push(await upload(d.imgs[k]))}catch(e){urls.push(d.imgs[k]);bad++}}
    busy=false;
    urls.forEach((img,k)=>items.unshift({id:nid++,img,fav:false,added:now+k,...base}));
    toast(bad?`已新增 ${n} 件，但有 ${bad} 張照片沒上傳成功`:`已新增 ${n} 件 ✨`);
  }else{let img=d.img;if(img.startsWith('data:')){busy=true;toast('上傳照片中…');try{img=await upload(img)}catch(e){toast('照片上傳失敗，先存在這支手機')}busy=false}
    let real=d.real||'';if(real.startsWith('data:')){busy=true;toast('上傳實拍照中…');try{real=await upload(real)}catch(e){toast('實拍照上傳失敗，先存在這支手機')}busy=false}
    const it=byId(d.id);Object.assign(it,base,{img,real});toast('已儲存');render();openForm(it);return}
  draft=null;sheet();render();
}
function compress(file){
  return new Promise(r=>{const u=URL.createObjectURL(file),m=new Image();
    m.onload=()=>{const k=Math.min(1,1200/Math.max(m.width,m.height)),cv=document.createElement('canvas');cv.width=Math.round(m.width*k);cv.height=Math.round(m.height*k);cv.getContext('2d').drawImage(m,0,0,cv.width,cv.height);URL.revokeObjectURL(u);r(cv.toDataURL('image/jpeg',.82))};
    m.onerror=()=>{URL.revokeObjectURL(u);r(null)};m.src=u});
}

/* 出售圖片 */
const loadImg=src=>new Promise(r=>{const m=new Image();if(/^https?:/.test(src))m.crossOrigin='anonymous';m.onload=()=>r(m);m.onerror=()=>r(null);m.src=src});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fit(c,t,w){t=String(t);if(c.measureText(t).width<=w)return t;while(t.length&&c.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
async function drawPage(list,per,n,total){
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const c=cv.getContext('2d'),F='Huninn,sans-serif';
  c.fillStyle='#f3ece3';c.fillRect(0,0,W,H);
  c.textAlign='center';c.fillStyle='#4b3f36';c.font=`700 54px ${F}`;c.fillText(fit(c,sell.title,W-120),W/2,100);
  c.font=`400 26px ${F}`;c.fillStyle='#9a8a7b';c.fillText(total>1?`${n+1} / ${total}`:'童裝二手出清',W/2,142);
  const cols=per==1?1:per==9?3:2,rows=per==1?1:per==4?2:3,pad=44,g=22,top=176,bot=H-122;
  const cw=(W-pad*2-g*(cols-1))/cols,ch=(bot-top-g*(rows-1))/rows,s=per==1?1.7:per==9?.78:per==6?.9:1.05,ih=Math.round(118*s);
  for(let k=0;k<list.length;k++){
    const i=list[k],x=pad+(k%cols)*(cw+g),y=top+Math.floor(k/cols)*(ch+g),phH=ch-ih;
    c.save();rr(c,x,y,cw,ch,24);c.fillStyle='#fffaf4';c.fill();c.clip();
    const m=await loadImg(i.real||i.img);
    c.fillStyle='#fff';c.fillRect(x,y,cw,phH);
    if(m){const r=Math.min((cw-24)/m.width,(phH-24)/m.height),w=m.width*r,h=m.height*r;c.drawImage(m,x+(cw-w)/2,y+(phH-h)/2,w,h)}
    if(!i.real){c.font=`500 ${Math.round(22*s)}px ${F}`;c.textAlign='left';const tw=c.measureText('示意圖').width;rr(c,x+12,y+12,tw+20*s,34*s,10);c.fillStyle='rgba(75,63,54,.72)';c.fill();c.fillStyle='#fff';c.fillText('示意圖',x+12+10*s,y+12+25*s)}
    c.restore();
    const ty=y+phH;
    c.textAlign='right';c.fillStyle='#a87e5c';c.font=`700 ${Math.round((i.price?46:28)*s)}px ${F}`;
    const pt=i.price?`$${i.price}`:'私訊詢價',pw=c.measureText(pt).width;c.fillText(pt,x+cw-18*s,ty+70*s);
    const lw=cw-pw-50*s;
    c.textAlign='left';c.fillStyle='#4b3f36';c.font=`700 ${Math.round(32*s)}px ${F}`;c.fillText(fit(c,`${i.size=='未填'?'':i.size+'　'}${i.cat}`,lw),x+18*s,ty+48*s);
    c.font=`400 ${Math.round(24*s)}px ${F}`;c.fillStyle='#9a8a7b';c.fillText(fit(c,[i.brand,i.cond].filter(Boolean).join(' · ')||' ',lw),x+18*s,ty+90*s);
  }
  c.textAlign='center';c.fillStyle='#6f6157';c.font=`500 28px ${F}`;c.fillText(fit(c,sell.note,W-160),W/2,H-64);
  c.fillStyle='#b8a898';c.font=`400 22px ${F}`;c.fillText('小嘟衣櫥',W/2,H-26);
  return cv.toDataURL('image/jpeg',.9);
}
async function gen(){
  const tok=++genTok,list=[...sell.sel].map(byId).filter(Boolean),per=sell.layout,pages=[];
  for(let k=0;k<list.length;k+=per)pages.push(list.slice(k,k+per));
  try{await document.fonts.load('40px Huninn')}catch(e){}
  const out=[];for(let n=0;n<pages.length;n++)out.push(await drawPage(pages[n],per,n,pages.length));
  if(tok!=genTok)return;pics=out;
  const p=$('#prev');if(p)p.innerHTML=out.map((u,i)=>`<img src="${u}" alt="出清圖片 ${i+1}">`).join('');
}
function dl(){
  if(!pics.length)return;
  try{pics.forEach((u,i)=>{const a=document.createElement('a');a.href=u;a.download=`小嘟二手衣-${i+1}.jpg`;document.body.appendChild(a);a.click();a.remove()})}catch(e){}
  toast('如果沒有下載，請長按圖片儲存');
}
function goStep(n){
  if(n==3){const miss=[...sell.sel].filter(x=>!byId(x).price).length;if(miss)toast(`有 ${miss} 件沒填價格，會顯示「私訊詢價」`)}
  sell.step=n;render();scrollTo(0,0);
}

/* 事件 */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,k=t.dataset.k,v=t.dataset.v,id=+t.dataset.id;
  switch(a){
    case 'nav':if(v=='add'){openForm();return}view=v;bm=false;bsel.clear();clr=false;render();scrollTo(0,0);break;
    case 'f':f[k]=(f[k]==v&&v!='all')?'all':v;render();break;
    case 'fav':{const i=byId(id);i.fav=!i.fav;render()}break;
    case 'open':openForm(byId(id));break;
    case 'd':draft[k]=v;if(k=='size')draft.cus=false;if(k=='status'&&v=='sold'&&!draft.sold)draft.sold=draft.price;sheet();break;
    case 'cus':draft.cus=true;if(SIZES.includes(draft.size))draft.size='';sheet();setTimeout(()=>{const x=$('[data-dk=size]');if(x)x.focus()},0);break;
    case 'close':if(e.target!==t)return;draft=null;sheet();break;
    case 'close2':draft=null;sheet();break;
    case 'bm':bm=!bm;bsel.clear();render();break;
    case 'bpick':bsel.has(id)?bsel.delete(id):bsel.add(id);render();break;
    case 'ball':if(lastList.length&&lastList.every(x=>bsel.has(x)))lastList.forEach(x=>bsel.delete(x));else lastList.forEach(x=>bsel.add(x));render();break;
    case 'bset':draft={mode:'batch',cat:'',size:'',season:'',status:''};sheet();break;
    case 'bd':draft[k]=draft[k]==v?'':v;sheet();break;
    case 'bapply':{const ch=['cat','size','season','status'].filter(x=>draft[x]);if(!ch.length){toast('請先點選要改的項目');return}bsel.forEach(x=>{const i=byId(x);if(i)ch.forEach(y=>i[y]=draft[y])});toast(`已更新 ${bsel.size} 件 ✨`);bsel.clear();draft=null;sheet();render()}break;
    case 'exp':{try{const b=new Blob([JSON.stringify({app:'xiaodu-closet',v:1,items,nid,kid})],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a'),dt=new Date();a.href=u;a.download=`小嘟衣櫥備份-${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('備份檔已下載')}catch(e){toast('這裡無法下載，請在正式網址使用')}}break;
    case 'rmreal':draft.real='';sheet();break;
    case 'edit':draft.mode='edit';sheet();break;
    case 'cancel':openForm(byId(draft.id));break;
    case 'vfav':{const i=byId(draft.id);i.fav=!i.fav;draft.fav=i.fav;sheet();render()}break;
    case 'save':save();break;
    case 'del':if(!delArm){delArm=true;sheet();return}items=items.filter(i=>i.id!=draft.id);sell.sel.delete(draft.id);draft=null;sheet();render();toast('已刪除');break;
    case 'pick1':sell.sel.has(id)?sell.sel.delete(id):sell.sel.add(id);render();break;
    case 'quick':if(v=='none')sell.sel.clear();else items.forEach(i=>{if(SELLABLE.includes(i.status)&&(v=='sell'?i.status=='sell':small(i)))sell.sel.add(i.id)});render();break;
    case 'step':goStep(+v);break;
    case 'uni':{const u=num($('#uni').value);if(!u){toast('先輸入金額');return}sell.sel.forEach(x=>byId(x).price=u);render();toast('全部套用 $'+u)}break;
    case 'qp':byId(+k).price=v;render();break;
    case 'cond':{const i=byId(+k);i.cond=i.cond==v?'':v;render()}break;
    case 'lay':sell.layout=+v;render();break;
    case 'dl':dl();break;
    case 'done':{const n=sell.sel.size;sell.sel.forEach(x=>{const i=byId(x);if(i&&i.status!='sold')i.status='sell'});sell={...sell,step:1,sel:new Set()};view='home';f={st:'sell',cat:'all',size:'all',season:'all'};render();scrollTo(0,0);toast(`${n} 件已標記為 💰準備賣`)}break;
    case 'kid':kid=v;render();toast('小嘟目前 '+v+' 號');break;
    case 'auto':{let n=0;items.forEach(i=>{if(i.status=='future'&&RANK[i.size]&&RANK[i.size]<=RANK[kid]){i.status='now';n++}});toast(n?`已把 ${n} 件移到 👕現在穿`:'目前沒有需要整理的衣服')}break;
    case 'clear':if(!clr){clr=true;render();return}items=[];clr=false;sell.sel.clear();render();toast('已清空，按 ＋ 開始新增');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.dk&&draft){draft[t.dataset.dk]=['cost','price','sold'].includes(t.dataset.dk)?num(t.value):t.value}
  else if(t.dataset.pid){const i=byId(+t.dataset.pid);i.price=num(t.value);persist();t.closest('.prow').querySelectorAll('[data-act=qp]').forEach(b=>b.classList.toggle('on',b.dataset.v==i.price))}
  else if(t.dataset.sk){sell[t.dataset.sk]=t.value;clearTimeout(gt);gt=setTimeout(gen,400)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.rid&&t.files[0]){const i=byId(+t.dataset.rid);toast('照片處理中…');const u=await compress(t.files[0]);if(!u||!i)return;toast('上傳實拍照中…');try{i.real=await upload(u);toast('已加上實拍照 📷')}catch(e){i.real=u;toast('上傳失敗，先存在這支手機')}render();return}
  if(t.id=='rf'&&draft&&t.files[0]){const u=await compress(t.files[0]);if(u){draft.real=u;sheet()}return}
  if(t.id=='pf'&&draft){const fs=[...t.files];if(!fs.length)return;toast('照片處理中…');const us=[];for(const fl of fs)us.push(await compress(fl));
    if(!draft.id)draft.imgs.push(...us.filter(Boolean));else if(us[0])draft.img=us[0];sheet();return}
  if(t.id=='imp'&&t.files[0]){try{const sv=JSON.parse(await t.files[0].text());if(!Array.isArray(sv.items))throw 0;items=sv.items;nid=sv.nid||items.reduce((a,i)=>Math.max(a,i.id),0)+1;kid=sv.kid||kid;render();toast(`已匯入 ${items.length} 件 ✨`)}catch(e){toast('這不是小嘟衣櫥的備份檔')}t.value='';return}
  if(t.dataset.sel){f[t.dataset.sel]=t.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&draft){draft=null;sheet()}});
render();
cloudInit();
}
</script>
